<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Attendance Gantt</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:"Space Grotesk","Hiragino Sans","Meiryo",sans-serif;background:#eef3f5;color:#132026;font-size:12px;}
.page{width:210mm;min-height:297mm;background:#fff;margin:12px auto;padding:6mm 5mm;box-shadow:0 8px 24px rgba(0,0,0,.08);}
body.embed{background:#fff;font-size:11px;}
body.embed .page{width:100%;min-height:0;margin:0;padding:4mm 4mm;box-shadow:none;}

/* Screen-only: fit the viewport. Desktop stretches to a comfortable monitor
   width, tablets shrink proportionally, phones drop to full-width with smaller
   padding. Print overrides below still lock to A4 portrait. */
@media screen{
  .page{width:min(calc(100vw - 24px),1400px);min-height:0;}
  .toolbar{max-width:min(calc(100vw - 24px),1400px);}
}
@media screen and (max-width:600px){
  body{font-size:11px;}
  .page{margin:8px auto;padding:4mm 3mm;}
  .toolbar{margin:8px auto 0;padding:8px;gap:6px;}
}

/* Toolbar */
.toolbar{max-width:210mm;margin:12px auto 0;padding:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:#fff;border-radius:6px;box-shadow:0 4px 12px rgba(0,0,0,.06);}
.toolbar label{display:flex;gap:6px;align-items:center;font-size:12px;}
.toolbar input[type=date]{padding:4px 6px;border:1px solid #d4e2e8;border-radius:4px;font:inherit;}
.toolbar button{padding:5px 12px;border:1px solid #d4e2e8;border-radius:4px;background:#fff;cursor:pointer;font:inherit;}
.toolbar button.primary{background:#0d8f71;color:#fff;border-color:#0d8f71;}
.toolbar button:hover{background:#f7fbfc;}
.toolbar button.primary:hover{background:#0b6f58;}

/* Header */
.doc-header{display:flex;align-items:baseline;justify-content:space-between;border-bottom:1.5px solid #132026;padding-bottom:4px;margin-bottom:6px;flex-wrap:wrap;gap:8px;}
.doc-title{font-size:13px;font-weight:700;}
.doc-meta{font-size:9px;color:#5a6b73;}

/* Summary — Productivity panel (bilingual) */
.summary{display:grid;grid-template-columns:1.2fr 1fr 1fr 1.2fr;gap:6px;margin-bottom:8px;}
.pcard{position:relative;border:0.5px solid #d4e2e8;border-radius:6px;padding:6px 9px;background:linear-gradient(180deg,#ffffff 0%,#f7fbfc 100%);overflow:hidden;}
.pcard.accent-packs{border-color:#0d8f71;background:linear-gradient(180deg,#eaf7f2 0%,#f7fbfc 100%);}
.pcard.accent-s1{border-color:#125e91;}
.pcard.accent-s2{border-color:#c7701b;}
.pcard.accent-combined{border-color:#6b3fa0;background:linear-gradient(180deg,#f4eefb 0%,#fafaff 100%);}
.pcard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:#d4e2e8;}
.pcard.accent-packs::before{background:#0d8f71;}
.pcard.accent-s1::before{background:#125e91;}
.pcard.accent-s2::before{background:#c7701b;}
.pcard.accent-combined::before{background:#6b3fa0;}
.p-tag{display:flex;align-items:baseline;gap:5px;margin-bottom:3px;padding-right:64px;flex-wrap:wrap;}
.p-tag-ja{font-size:10px;font-weight:700;color:#132026;letter-spacing:.02em;}
.p-tag-en{font-size:7px;color:#5a6b73;text-transform:uppercase;letter-spacing:.05em;font-weight:600;}
.p-val{display:flex;align-items:baseline;gap:3px;line-height:1;}
.p-num{font-size:19px;font-weight:800;color:#132026;letter-spacing:-.01em;}
.p-unit{font-size:10px;font-weight:700;color:#5a6b73;}
.p-sub{display:flex;justify-content:space-between;align-items:center;margin-top:3px;font-size:7px;color:#8a9ba3;}
.p-sub strong{color:#5a6b73;font-weight:600;}
.p-pill{display:inline-block;padding:1px 5px;border-radius:8px;background:#eef3f5;color:#5a6b73;font-size:7px;font-weight:700;letter-spacing:.03em;}
.pcard.accent-packs .p-pill{background:#d6f0e5;color:#0d8f71;}
.pcard.accent-s1 .p-pill{background:#dceaf4;color:#125e91;}
.pcard.accent-s2 .p-pill{background:#f4e0cd;color:#c7701b;}
.pcard.accent-combined .p-pill{background:#e4daf2;color:#6b3fa0;}
/* Previous-day delta badge — sits in the top-right corner so it never collides
   with the title / number. up = green, down = red, flat/missing = gray. */
.p-delta{position:absolute;top:4px;right:6px;display:inline-flex;align-items:center;gap:2px;padding:1px 5px;border-radius:8px;font-size:8px;font-weight:700;letter-spacing:.02em;line-height:1;border:0.5px solid transparent;}
.p-delta.up{background:#d6f0e5;color:#0d8f71;border-color:#0d8f71;}
.p-delta.down{background:#fadadc;color:#b42318;border-color:#b42318;}
.p-delta.flat{background:#eef3f5;color:#8a9ba3;border-color:#d4e2e8;}
.p-delta.na{background:transparent;color:#b5c2c8;border-color:#d4e2e8;}
.p-delta .pd-ar{font-size:9px;line-height:1;}

/* Legacy summary card (kept for Productivity tab) */
.scard{border:0.5px solid #d4e2e8;border-radius:3px;padding:4px 6px;}
.sc-lbl{font-size:7px;color:#5a6b73;margin-bottom:1px;text-transform:uppercase;letter-spacing:.04em;}
.sc-val{font-size:13px;font-weight:700;color:#132026;}
.sc-hint{font-size:7px;color:#8a9ba3;}

/* Tabs */
.tabs{display:flex;gap:2px;border-bottom:1px solid #d4e2e8;margin-bottom:6px;}
.tab{padding:5px 12px;background:#f7fbfc;border:1px solid #d4e2e8;border-bottom:none;border-radius:4px 4px 0 0;cursor:pointer;font-size:10px;font-weight:600;color:#5a6b73;}
.tab.active{background:#fff;color:#0d8f71;border-color:#0d8f71;border-bottom:1px solid #fff;margin-bottom:-1px;}
.tab-count{font-weight:400;color:#8a9ba3;margin-left:4px;}

/* Legend */
.legend{display:flex;gap:10px;margin-bottom:6px;flex-wrap:wrap;}
.leg{display:flex;align-items:center;gap:4px;font-size:7px;color:#5a6b73;}
.leg-box{width:10px;height:7px;border-radius:2px;flex-shrink:0;}

/* Section */
.sec-wrap{display:none;}
.sec-wrap.active{display:block;}
.sec-lbl{font-size:9px;font-weight:700;letter-spacing:.04em;color:#132026;padding:4px 0 3px;border-bottom:0.5px solid #d4e2e8;margin:6px 0 3px;}

/* Axis */
.axis-row{display:flex;padding-left:100px;padding-right:30px;margin-bottom:2px;}
.axis-tick{flex:1;font-size:7px;color:#8a9ba3;white-space:nowrap;text-align:left;border-left:0.5px dotted #e5edf0;padding-left:1px;}
.axis-tick:first-child{border-left:none;}
.axis-tick.mn{color:#b42318;font-weight:700;}

/* Rows */
.emp-block{margin-bottom:2px;}
.emp-row{display:flex;align-items:center;}
.name-cell{width:100px;flex-shrink:0;padding-right:4px;}
.name-main{font-size:9px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#132026;}
.name-code{font-size:7px;color:#8a9ba3;font-family:"IBM Plex Mono",monospace;}
/* Temp-staff (フルキャスト) rows — orange accent so they're visually distinct
   from payroll employees. Bar color is overridden in renderRow. */
.emp-block.is-temp .name-main{color:#c7701b;font-weight:600;}
.emp-block.is-temp .name-code{color:#c7701b;}
.emp-block.is-temp .name-code::before{content:"派遣 · ";color:#c7701b;font-weight:700;}

.track-wrap{flex:1;position:relative;}
.track{width:100%;height:15px;background:#f0f3f5;border-radius:2px;position:relative;overflow:hidden;}
.seg{position:absolute;top:0;height:15px;border-radius:2px;display:flex;align-items:center;justify-content:space-between;overflow:hidden;padding:0 4px;gap:3px;}
.seg.narrow{justify-content:flex-start;padding-left:3px;}
.seg-lbl{font-size:7px;font-weight:700;white-space:nowrap;letter-spacing:.01em;}
.seg-lbl.seg-r{opacity:.92;}
.mn-line{position:absolute;top:0;height:100%;width:1px;background:rgba(180,35,24,0.9);z-index:10;}
.total-cell{width:34px;flex-shrink:0;padding-left:4px;text-align:right;}
.total-hrs{font-size:9px;font-weight:700;}

.empty-msg{padding:20px;text-align:center;color:#8a9ba3;font-size:11px;}
.no-data{margin:16px 0;padding:18px;border:1px dashed #d4e2e8;border-radius:6px;background:#f7fbfc;text-align:center;}
.no-data h3{font-size:14px;color:#132026;margin-bottom:6px;}
.no-data p{font-size:11px;color:#5a6b73;margin-bottom:10px;}
.no-data a{color:#0d8f71;text-decoration:none;font-weight:600;font-size:11px;margin:0 6px;}
.no-data a:hover{text-decoration:underline;}

/* Productivity view */
.prod-wrap{display:none;}
.prod-wrap.active{display:block;}
.prod-controls{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:8px;}
.prod-pills{display:flex;gap:2px;background:#f0f3f5;border-radius:4px;padding:2px;}
.prod-pill{padding:4px 10px;border:none;background:transparent;cursor:pointer;font:600 10px/1 inherit;color:#5a6b73;border-radius:3px;}
.prod-pill.active{background:#0d8f71;color:#fff;}
.prod-spacer{flex:1;}
.prod-btn{padding:4px 10px;border:1px solid #d4e2e8;background:#fff;border-radius:4px;cursor:pointer;font:600 10px/1 inherit;color:#132026;}
.prod-btn:hover{background:#f7fbfc;}
.prod-btn.primary{background:#0d8f71;color:#fff;border-color:#0d8f71;}
.prod-btn.primary:hover{background:#0b6f58;}
.prod-check{display:flex;align-items:center;gap:4px;font-size:10px;color:#5a6b73;cursor:pointer;}

.psc-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:8px;}
.psc{border:0.5px solid #d4e2e8;border-radius:4px;padding:6px 8px;background:#fff;}
.psc-lbl{font-size:8px;color:#5a6b73;text-transform:uppercase;letter-spacing:.04em;margin-bottom:2px;}
.psc-val{font-size:15px;font-weight:700;color:#132026;line-height:1.1;}
.psc-delta{font-size:8px;margin-top:2px;}
.psc-delta.up{color:#0d8f71;}
.psc-delta.down{color:#b42318;}
.psc-delta.flat{color:#8a9ba3;}

.toggle-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px;}
.tgl{padding:3px 9px;border:1px solid #d4e2e8;border-radius:12px;cursor:pointer;font:600 9px/1 inherit;color:#5a6b73;background:#fff;display:flex;align-items:center;gap:4px;}
.tgl.active{color:#132026;border-color:#132026;}
.tgl-dot{width:8px;height:8px;border-radius:50%;}

.charts-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.chart-card{border:0.5px solid #d4e2e8;border-radius:4px;padding:6px 8px 4px;background:#fff;opacity:0;transform:translateY(6px);transition:opacity .4s ease,transform .4s ease;}
.chart-card.show{opacity:1;transform:none;}
.chart-title{font-size:9px;font-weight:700;color:#132026;margin-bottom:4px;display:flex;justify-content:space-between;align-items:baseline;}
.chart-title small{font-weight:400;color:#8a9ba3;font-size:8px;}
.chart-svg{width:100%;height:auto;display:block;overflow:visible;}
.chart-svg .grid{stroke:#eef3f5;stroke-width:1;}
.chart-svg .axis{stroke:#d4e2e8;stroke-width:1;}
.chart-svg .axis-lbl{fill:#8a9ba3;font-size:8px;}
.chart-svg .line-cur{fill:none;stroke-width:1.5;}
.chart-svg .line-prev{fill:none;stroke-width:1;stroke-dasharray:3 2;opacity:.5;}
.chart-svg .line-enter{stroke-dasharray:1000;stroke-dashoffset:1000;animation:draw 0.9s ease forwards;}
@keyframes draw{to{stroke-dashoffset:0;}}
.chart-svg .dot{fill:#fff;stroke-width:1.2;}
.chart-svg .cross{stroke:#132026;stroke-width:1;stroke-dasharray:2 2;opacity:0;pointer-events:none;}
.chart-svg.hover .cross{opacity:.55;}
.chart-tip{position:absolute;background:#132026;color:#fff;padding:4px 6px;border-radius:3px;font:600 9px/1.3 inherit;pointer-events:none;white-space:nowrap;opacity:0;transition:opacity .1s;z-index:20;}
.chart-tip.show{opacity:1;}
.chart-wrap{position:relative;}

/* Responsive */
@media (max-width:900px){
  .psc-grid{grid-template-columns:repeat(3,1fr);}
  .charts-grid{grid-template-columns:1fr;}
  .page{width:100%;padding:6mm 4mm;}
  .toolbar{max-width:100%;}
  .summary{grid-template-columns:repeat(2,1fr);}
  .axis-row{padding-left:70px;padding-right:24px;}
  .name-cell{width:70px;}
}
@media (max-width:540px){
  .psc-grid{grid-template-columns:repeat(2,1fr);}
  .doc-meta{display:none;}
  .tab{padding:4px 8px;font-size:9px;}
  .axis-tick{font-size:6px;}
}

/* Print — compact, target 1–2 pages */
@media print{
  body{background:#fff;font-size:10px;}
  .page{width:210mm;margin:0;padding:3mm 4mm;box-shadow:none;}
  .no-print{display:none!important;}
  .sec-wrap{display:block!important;page-break-inside:auto;}
  .tabs{display:none!important;}
  .prod-wrap{display:none!important;}
  .doc-header{padding-bottom:2px;margin-bottom:3px;}
  .summary{gap:4px;margin-bottom:4px;}
  .pcard{padding:4px 7px;border-radius:4px;}
  .p-num{font-size:16px;}
  .p-delta{top:3px;right:4px;padding:0 4px;font-size:7px;}
  .p-delta .pd-ar{font-size:8px;}
  .p-tag{padding-right:52px;}
  .legend{gap:8px;margin-bottom:3px;}
  .emp-block{margin-bottom:1px;page-break-inside:avoid;}
  .emp-row{align-items:center;}
  .track,.seg{height:12px;}
  .sec-lbl{margin:3px 0 2px;padding:2px 0 1px;}
  body.print-prod .sec-wrap{display:none!important;}
  body.print-prod .prod-wrap{display:block!important;}
  body.print-prod .prod-controls,body.print-prod .no-print{display:none!important;}
  @page{size:A4 portrait;margin:4mm;}
}
</style>
</head>
<body>

<div class="toolbar no-print" id="toolbar">
  <label>Date: <input type="date" id="dateInput"></label>
  <button id="refreshBtn" type="button">Refresh</button>
  <button id="printBtn" class="primary" type="button">⬇ Download PDF</button>
</div>

<div class="page">
  <div class="doc-header">
    <span class="doc-title" id="docTitle">勤怠記録 — Attendance Report</span>
    <span class="doc-meta">Window: 10:00 → 08:30 next day</span>
  </div>
  <div class="summary" id="summary"></div>
  <div class="legend">
    <div class="leg"><div class="leg-box" style="background:#125e91;"></div>In-window shift</div>
    <div class="leg"><div class="leg-box" style="background:#8a9ba3;"></div>Morning (out-of-window)</div>
    <div class="leg"><div class="leg-box" style="background:#f0f3f5;border:0.5px solid #d4e2e8;"></div>Absent</div>
    <div class="leg"><div class="leg-box" style="background:#e8f0fe;border:0.5px solid #a3bfe0;"></div>Data not received</div>
    <div class="leg"><div class="leg-box" style="background:#c7701b;"></div>派遣 · Temp staff (フルキャスト)</div>
    <div class="leg"><div style="width:2px;height:9px;background:#b42318;"></div>&nbsp;Midnight</div>
  </div>
  <nav class="tabs no-print" id="tabs"></nav>
  <div id="sections"></div>
  <div class="prod-wrap" id="prodWrap">
    <div class="prod-controls no-print">
      <div class="prod-pills" id="prodRange">
        <button class="prod-pill" data-range="day" type="button">Day</button>
        <button class="prod-pill active" data-range="week" type="button">Week</button>
        <button class="prod-pill" data-range="month" type="button">Month</button>
        <button class="prod-pill" data-range="3month" type="button">3 Month</button>
      </div>
      <label class="prod-check"><input type="checkbox" id="prodCompare" checked> Compare previous</label>
      <div class="prod-spacer"></div>
      <button class="prod-btn" id="prodCsvBtn" type="button">⬇ CSV</button>
      <button class="prod-btn primary" id="prodPdfBtn" type="button">⬇ PDF</button>
    </div>
    <div class="psc-grid" id="prodSummary"></div>
    <div class="toggle-row" id="prodToggles"></div>
    <div class="charts-grid" id="prodCharts"></div>
  </div>
</div>
<div class="chart-tip" id="chartTip"></div>

<script>
// Window: 10:00 → 08:30 next day (22.5 hrs). Midnight falls at axis hour 14.
const WIN_START=10, WIN_HOURS=22.5, MN_AX=24-WIN_START, MN_PCT=(MN_AX/WIN_HOURS)*100;
const params=new URLSearchParams(location.search);
if(params.get('embed')==='1')document.body.classList.add('embed');

const $=id=>document.getElementById(id);
const parseH=s=>{if(!s)return null;const t=String(s).replace(/\s*hr?s?\.?\s*$/i,'').trim();if(!t)return null;const[h,m]=t.split(':').map(Number);return isNaN(h)?null:h+(m||0)/60;};
const parseWH=s=>{if(!s)return 0;const t=String(s).replace(/\s*hr?s?\.?\s*$/i,'').trim();if(!t||t==='0:00')return 0;const[h,m]=t.split(':').map(Number);return isNaN(h)?0:h+(m||0)/60;};
const fmtH=h=>{const hh=Math.floor(h),mm=Math.round((h-hh)*60);return mm===0?`${hh}h`:`${hh}h${String(mm).padStart(2,'0')}`;};
const toAxis=r=>(r<WIN_START?r+24:r)-WIN_START;
const toPct=a=>Math.max(0,Math.min(100,(a/WIN_HOURS)*100));
// Next-day leave (e.g. 04:00 → "28:00") — pads as HH:MM once it crosses midnight.
function fmtOutTime(inH,outH,outStr){
  if(!outStr||outH===null)return '';
  if(inH!==null&&outH<=inH){
    const parts=String(outStr).trim().split(':');
    const hh=parseInt(parts[0],10);
    const mm=parts[1]?parts[1].padStart(2,'0'):'00';
    if(!isNaN(hh))return `${String(hh+24).padStart(2,'0')}:${mm}`;
  }
  return outStr;
}
// Dual-format leave label, e.g. "28:00 / 04:00". When the shift does NOT cross
// midnight we just return the clock time. Used for both screen and PDF so both
// continuous-axis time and actual wall-clock time are visible at a glance.
function fmtOutTimeDual(inH,outH,outStr){
  if(!outStr||outH===null)return '';
  if(inH!==null&&outH<=inH){
    const parts=String(outStr).trim().split(':');
    const hh=parseInt(parts[0],10);
    const mm=parts[1]?parts[1].padStart(2,'0'):'00';
    if(!isNaN(hh)){
      const plus=`${String(hh+24).padStart(2,'0')}:${mm}`;
      const clock=`${String(hh).padStart(2,'0')}:${mm}`;
      return `${plus} / ${clock}`;
    }
  }
  return outStr;
}
function fmtHHMM(h){
  if(!h||h<=0)return '0:00';
  const total=Math.round(h*60);
  return `${Math.floor(total/60)}:${String(total%60).padStart(2,'0')}`;
}

function classify(r){
  const hi=r.in!==null, ho=r.out!==null, wh=parseWH(r.wh);
  if(wh===0&&!hi&&!ho)return 'absent';
  if(wh===0&&(hi!==ho))return 'dnr';
  if(wh>0)return 'present';
  return 'absent';
}

function renderAxis(){
  const row=document.createElement('div');
  row.className='axis-row';
  for(let i=0;i<=WIN_HOURS;i+=2){
    const rh=(WIN_START+i)%24;
    const t=document.createElement('div');
    t.className='axis-tick'+(rh===0?' mn':'');
    t.textContent=`${String(rh).padStart(2,'0')}:00`;
    row.appendChild(t);
  }
  return row;
}

function renderRow(emp){
  const wh=parseWH(emp.wh), inH=parseH(emp.in), outH=parseH(emp.out), cls=classify(emp);
  // Temp-staff synthetic rows come from temp_staff — identified by the
  // "TEMP-" code prefix (or the explicit is_temp flag the backend now sends).
  // Render them with an orange bar + 派遣 pill so they're visibly distinct.
  const isTemp=!!emp.is_temp||(typeof emp.code==='string'&&emp.code.startsWith('TEMP-'));
  const block=document.createElement('div');block.className='emp-block'+(isTemp?' is-temp':'');
  const empRow=document.createElement('div');empRow.className='emp-row';

  const nc=document.createElement('div');nc.className='name-cell';
  nc.innerHTML=`<div class="name-main" title="${emp.name}">${emp.name||'—'}</div><div class="name-code">${isTemp?(emp.headcount||'?')+'名':emp.code}</div>`;

  const tw=document.createElement('div');tw.className='track-wrap';
  const track=document.createElement('div');track.className='track';
  const ml=document.createElement('div');ml.className='mn-line';ml.style.left=MN_PCT.toFixed(2)+'%';track.appendChild(ml);

  const tc=document.createElement('div');tc.className='total-cell';

  // Paint a segment with start (and optional leave) labels inside the bar.
  // Dual-format overnight labels ("28:00 / 04:00") need more room than a plain
  // HH:MM, so we adapt the min width: dual leave needs ≥18% to show both parts,
  // otherwise fall back to the short leave form. Start labels stay at >5%.
  const paintSeg=(axStart,axEnd,color,tcol,opts)=>{
    const bw=axEnd-axStart;
    if(bw<=0)return;
    const seg=document.createElement('div');seg.className='seg';
    const l=toPct(axStart),w=toPct(bw);
    seg.style.cssText=`left:${l.toFixed(2)}%;width:${w.toFixed(2)}%;background:${color};`+(opts.opacity?`opacity:${opts.opacity};`:'');
    const dual=opts.outLabel&&opts.outLabel.includes(' / ');
    const shortOut=dual?opts.outLabel.split(' / ')[0]:opts.outLabel;
    const outShown=dual?(w>=18?opts.outLabel:shortOut):opts.outLabel;
    const hasIn=opts.inLabel&&w>5;
    const hasOut=opts.outLabel&&w>=8;
    if(hasIn&&hasOut){
      seg.innerHTML=`<span class="seg-lbl seg-l" style="color:${tcol};">${opts.inLabel}</span><span class="seg-lbl seg-r" style="color:${tcol};">${outShown}</span>`;
    }else if(hasIn){
      seg.classList.add('narrow');
      seg.innerHTML=`<span class="seg-lbl seg-l" style="color:${tcol};">${opts.inLabel}</span>`;
    }else if(hasOut){
      seg.classList.add('narrow');
      seg.innerHTML=`<span class="seg-lbl seg-r" style="color:${tcol};">${outShown}</span>`;
    }
    track.appendChild(seg);
    if(opts.outLabel&&!hasOut&&!opts.opacity){
      const out=document.createElement('span');
      out.className='seg-lbl seg-out';
      out.style.cssText=`position:absolute;left:${(l+w).toFixed(2)}%;top:50%;transform:translateY(-50%);margin-left:3px;color:${color};`;
      out.textContent=shortOut;
      tw.appendChild(out);
    }
  };

  if(cls==='absent'){
    const ab=document.createElement('div');
    ab.style.cssText='position:absolute;inset:0;display:flex;align-items:center;padding-left:6px;';
    ab.innerHTML='<span style="font-size:7px;color:#8a9ba3;">Absent</span>';
    track.appendChild(ab);
    tc.innerHTML='<span style="font-size:7px;color:#8a9ba3;">—</span>';
  }else if(cls==='dnr'){
    track.style.background='#e8f0fe';
    const t=emp.in||emp.out||'';
    const ab=document.createElement('div');
    ab.style.cssText='position:absolute;inset:0;display:flex;align-items:center;padding-left:6px;gap:4px;';
    ab.innerHTML=`<span style="font-size:7px;color:#125e91;font-weight:600;">Data not received</span><span style="font-size:7px;color:#5a6b73;">${t}</span>`;
    track.appendChild(ab);
    tc.innerHTML='<span style="font-size:7px;color:#125e91;">—</span>';
  }else{
    const isMorning=inH!==null&&inH<WIN_START;
    const isSplit=outH!==null&&outH>0&&outH<inH;
    const toMN=outH===0||(outH!==null&&outH<0.1&&inH>12);
    // Orange for temp-staff so they read as a separate population inside S2.
    const color=isTemp?'#c7701b':(isMorning?'#8a9ba3':'#125e91');
    const tcol=(isTemp||!isMorning)?'#fff':'#132026';
    // Dual label for overnight shifts: "28:00 / 04:00". Midnight exact becomes
    // "24:00 / 00:00". paintSeg collapses to the short form if bar is too narrow.
    const outShown=toMN?'24:00 / 00:00':fmtOutTimeDual(inH,outH,emp.out);

    let axIn,axOut;
    if(isMorning){axIn=0;axOut=outH!==null?toAxis(outH):toAxis(inH+wh);}
    else if(isSplit){axIn=toAxis(inH);axOut=WIN_HOURS;}
    else if(toMN){axIn=toAxis(inH);axOut=MN_AX;}
    else{axIn=toAxis(inH);axOut=outH!==null&&outH>inH?toAxis(outH):Math.min(toAxis(inH)+wh,WIN_HOURS);}
    axIn=Math.max(0,axIn);axOut=Math.min(WIN_HOURS,axOut);

    if(isSplit){
      // First segment: in → midnight (primary bar with both labels).
      const s1s=Math.max(0,toAxis(inH)),s1e=MN_AX;
      paintSeg(s1s,s1e,color,tcol,{inLabel:emp.in,outLabel:outShown});
      // Second segment: midnight → out (lighter continuation, no labels).
      const s2s=MN_AX,s2e=Math.min(WIN_HOURS,toAxis(outH));
      paintSeg(s2s,s2e,color,tcol,{opacity:'.55'});
    }else{
      paintSeg(axIn,axOut,color,tcol,{inLabel:emp.in,outLabel:outShown});
    }
    const whShown=isTemp&&emp.total_hours?Number(emp.total_hours):wh;
    tc.innerHTML=`<div class="total-hrs" style="color:${color};">${fmtH(whShown)}</div>`;
  }

  tw.appendChild(track);
  empRow.appendChild(nc);empRow.appendChild(tw);empRow.appendChild(tc);
  block.appendChild(empRow);
  return block;
}

function render(data){
  $('docTitle').textContent=`勤怠記録 — Attendance Report｜${data.date}`;
  const secBox=$('sections');secBox.innerHTML='';
  const tabs=$('tabs');tabs.innerHTML='';

  const all=data.sections.flatMap(s=>s.rows);
  if(all.length===0){
    $('summary').innerHTML='';
    secBox.innerHTML=`
      <div class="no-data">
        <h3>No attendance records for ${data.date}</h3>
        <p>Upload a PDF for this date, or try a date that already has data:</p>
        <div id="noDataLinks"><span style="color:#8a9ba3;font-size:11px;">loading…</span></div>
      </div>`;
    fetch('api/gantt/dates-with-data').then(r=>r.json()).then(j=>{
      const el=document.getElementById('noDataLinks');
      if(!el)return;
      if(!j.dates||!j.dates.length){el.innerHTML='<span style="color:#8a9ba3;font-size:11px;">No dates available yet.</span>';return;}
      el.innerHTML=j.dates.slice(0,8).map(d=>`<a href="?date=${d}">${d}</a>`).join(' · ');
    }).catch(()=>{});
    return;
  }

  // Productivity summary — bilingual cards. If packs or section hours are
  // missing, show a "—" placeholder with a small hint so the card never looks
  // broken. Works for every date; backends older than the productivity field
  // fall back to per-section totals computed client-side.
  let prod=data.productivity||null;
  if(!prod){
    // Client-side fallback if backend hasn't been updated yet.
    const perSecFallback=data.sections.filter(s=>s.id).map(s=>{
      const h=s.rows.reduce((a,r)=>a+parseWH(r.wh),0);
      const p=s.rows.filter(r=>parseWH(r.wh)>0).length;
      return {id:s.id,label:s.label,staff_present:p,staff_total:s.rows.length,total_hours:h,total_hours_hhmm:fmtHHMM(h),lp:0};
    });
    const ch=perSecFallback.reduce((a,s)=>a+s.total_hours,0);
    const cp=perSecFallback.reduce((a,s)=>a+s.staff_present,0);
    prod={total_packs:0,sections:perSecFallback,combined:{staff_present:cp,total_hours:ch,total_hours_hhmm:fmtHHMM(ch),lp:0}};
  }
  const fmtLP=(lp,hours,packs)=>{
    if(!packs||!hours||hours<=0)return '—';
    const v=Number(lp);
    return isFinite(v)&&v>0?v.toFixed(2):'—';
  };
  const fmtCnt=n=>(!n)?'—':Number(n).toLocaleString();
  const packs=prod.total_packs||0;
  const s1=prod.sections.find(s=>s.id===1)||{label:'製造１課',total_hours:0,total_hours_hhmm:'0:00',lp:0,staff_present:0,staff_total:0};
  const s2=prod.sections.find(s=>s.id===2)||{label:'製造２課',total_hours:0,total_hours_hhmm:'0:00',lp:0,staff_present:0,staff_total:0};
  const co=prod.combined||{total_hours:0,total_hours_hhmm:'0:00',lp:0,staff_present:0};
  const packsHint=packs>0?`Total output for <strong>${data.date}</strong>`:`<em style="color:#b42318;">Pack count not saved yet for ${data.date}</em>`;

  // Previous-day comparison badge. Green ▲ when the value went up, red ▼ when
  // it went down, gray dash when unchanged or when we have no prior data to
  // compare against (e.g. brand-new date range). Rendered as an absolutely
  // positioned pill in the top-right corner so it doesn't reflow card text.
  const prev=prod.previous||null;
  const prevDate=prod.previous_date||'';
  const prevS1=prev?(prev.sections||[]).find(s=>s.id===1):null;
  const prevS2=prev?(prev.sections||[]).find(s=>s.id===2):null;
  const prevCo=prev?prev.combined:null;
  const deltaBadge=(cur,prv,digits)=>{
    const cv=Number(cur), pv=Number(prv);
    if(!isFinite(cv)||cv<=0||!isFinite(pv)||pv<=0){
      return `<span class="p-delta na" title="No previous-day data for ${prevDate||'prior day'}">— n/a</span>`;
    }
    const pct=((cv-pv)/pv)*100;
    const cls=pct>0.5?'up':(pct<-0.5?'down':'flat');
    const ar=cls==='up'?'▲':(cls==='down'?'▼':'–');
    const sign=pct>0?'+':'';
    return `<span class="p-delta ${cls}" title="vs ${prevDate||'prev day'}: ${pv.toFixed(digits)}"><span class="pd-ar">${ar}</span>${sign}${pct.toFixed(1)}%</span>`;
  };
  const dPacks=deltaBadge(packs, prev?prev.total_packs:0, 0);
  const dS1=deltaBadge(s1.lp, prevS1?prevS1.lp:0, 2);
  const dS2=deltaBadge(s2.lp, prevS2?prevS2.lp:0, 2);
  const dCo=deltaBadge(co.lp, prevCo?prevCo.lp:0, 2);

  $('summary').innerHTML=`
    <div class="pcard accent-packs">
      ${dPacks}
      <div class="p-tag"><span class="p-tag-ja">製造パック数</span><span class="p-tag-en">Packs Manufactured</span></div>
      <div class="p-val"><span class="p-num">${fmtCnt(packs)}</span><span class="p-unit">P</span></div>
      <div class="p-sub"><span>${packsHint}</span><span class="p-pill">TOTAL</span></div>
    </div>
    <div class="pcard accent-s1">
      ${dS1}
      <div class="p-tag"><span class="p-tag-ja">${s1.label} 人時生産性</span><span class="p-tag-en">Dept. Labor Productivity</span></div>
      <div class="p-val"><span class="p-num">${fmtLP(s1.lp,s1.total_hours,packs)}</span><span class="p-unit">P/h</span></div>
      <div class="p-sub"><span>Hours <strong>${s1.total_hours_hhmm}</strong> · Staff <strong>${s1.staff_present}/${s1.staff_total}</strong></span><span class="p-pill">S1</span></div>
    </div>
    <div class="pcard accent-s2">
      ${dS2}
      <div class="p-tag"><span class="p-tag-ja">${s2.label} 人時生産性</span><span class="p-tag-en">Dept. Labor Productivity</span></div>
      <div class="p-val"><span class="p-num">${fmtLP(s2.lp,s2.total_hours,packs)}</span><span class="p-unit">P/h</span></div>
      <div class="p-sub"><span>Hours <strong>${s2.total_hours_hhmm}</strong> · Staff <strong>${s2.staff_present}/${s2.staff_total}</strong></span><span class="p-pill">S2</span></div>
    </div>
    <div class="pcard accent-combined">
      ${dCo}
      <div class="p-tag"><span class="p-tag-ja">人時生産性計算　合計</span><span class="p-tag-en">Combined Labor Productivity</span></div>
      <div class="p-val"><span class="p-num">${fmtLP(co.lp,co.total_hours,packs)}</span><span class="p-unit">P/h</span></div>
      <div class="p-sub"><span>Total hours <strong>${co.total_hours_hhmm}</strong> · Staff <strong>${co.staff_present}</strong></span><span class="p-pill">TOTAL</span></div>
    </div>
  `.replace(/\s+</g,'<');

  // Tabs + sections
  const showSection=idx=>{
    document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
    document.querySelectorAll('.sec-wrap').forEach(w=>w.classList.remove('active'));
    $('prodWrap').classList.remove('active');
    const t=document.querySelector(`.tab[data-idx="${idx}"]`);
    if(t)t.classList.add('active');
    const w=document.querySelector(`.sec-wrap[data-idx="${idx}"]`);
    if(w)w.classList.add('active');
  };
  data.sections.forEach((s,i)=>{
    const tab=document.createElement('button');
    tab.type='button';tab.className='tab'+(i===0?' active':'');
    tab.dataset.idx=i;
    tab.innerHTML=`${s.label}<span class="tab-count">${s.rows.length}</span>`;
    tab.onclick=()=>showSection(i);
    tabs.appendChild(tab);

    const w=document.createElement('div');
    w.className='sec-wrap'+(i===0?' active':'');
    w.dataset.idx=i;
    const lbl=document.createElement('div');lbl.className='sec-lbl';lbl.textContent=s.label;w.appendChild(lbl);
    w.appendChild(renderAxis());
    if(s.rows.length===0){
      const e=document.createElement('div');e.className='empty-msg';e.textContent='No records for this section.';w.appendChild(e);
    }else{
      s.rows.forEach(r=>w.appendChild(renderRow(r)));
    }
    secBox.appendChild(w);
  });

  // Productivity tab
  const ptab=document.createElement('button');
  ptab.type='button';ptab.className='tab';
  ptab.innerHTML='📊 Productivity';
  ptab.onclick=()=>{
    document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
    document.querySelectorAll('.sec-wrap').forEach(w=>w.classList.remove('active'));
    ptab.classList.add('active');
    $('prodWrap').classList.add('active');
    Productivity.ensureLoaded();
  };
  tabs.appendChild(ptab);
}

async function load(date){
  try{
    // cache-bust so refresh always shows the latest data + latest design
    const r=await fetch(`api/gantt/${date}?_=${Date.now()}`,{cache:'no-store'});
    if(!r.ok)throw new Error(r.statusText);
    const data=await r.json();
    render(data);
  }catch(e){
    $('sections').innerHTML=`<div class="empty-msg">Failed to load: ${e.message}</div>`;
  }
}

const Productivity = (()=>{
  const CHARTS = [
    {key:'packs', title:'Packs per day', unit:'packs', series:['packs'], colors:{packs:'#0d8f71'}},
    {key:'lp_s1', title:'Labor Productivity — 製造１課 (S1)', unit:'p/h', series:['lp_s1'], colors:{lp_s1:'#125e91'}},
    {key:'lp_s2', title:'Labor Productivity — 製造２課 (S2)', unit:'p/h', series:['lp_s2'], colors:{lp_s2:'#c7701b'}},
    {key:'lp_combined', title:'Labor Productivity — Combined', unit:'p/h', series:['lp_combined'], colors:{lp_combined:'#6b3fa0'}},
  ];
  const COLORS = {lp_s1:'#125e91', lp_s2:'#c7701b', lp_combined:'#6b3fa0', packs:'#0d8f71'};
  const LABELS = {lp_s1:'S1', lp_s2:'S2', lp_combined:'Combined'};
  let state = {range:'week', compare:true, enabled:{lp_s1:true, lp_s2:true, lp_combined:true}, data:null, loaded:false};
  const tip = () => document.getElementById('chartTip');

  const fmtDate = s => s.slice(5).replace('-','/');
  const fmtNum = n => n>=1000 ? n.toLocaleString() : (Number.isInteger(n) ? String(n) : n.toFixed(1));
  const deltaCls = d => d>0.01?'up':(d<-0.01?'down':'flat');
  const deltaArrow = d => d>0.01?'▲':(d<-0.01?'▼':'—');

  function renderSummary(){
    const cur = state.data.current.summary, prev = state.data.previous.summary;
    const rows = [
      {k:'Total packs', v:cur.total_packs, p:prev.total_packs, fmt:fmtNum},
      {k:'Total hours', v:cur.total_hours_combined, p:prev.total_hours_combined, fmt:v=>v.toFixed(1)+'h'},
      {k:'LP — S1', v:cur.lp_s1, p:prev.lp_s1, fmt:v=>v.toFixed(2)+' p/h'},
      {k:'LP — S2', v:cur.lp_s2, p:prev.lp_s2, fmt:v=>v.toFixed(2)+' p/h'},
      {k:'LP — Combined', v:cur.lp_combined, p:prev.lp_combined, fmt:v=>v.toFixed(2)+' p/h'},
    ];
    document.getElementById('prodSummary').innerHTML = rows.map(r=>{
      const d = r.p ? ((r.v - r.p) / r.p) * 100 : 0;
      const cls = deltaCls(d);
      const txt = r.p ? `${deltaArrow(d)} ${Math.abs(d).toFixed(1)}% vs prev` : 'no prev';
      return `<div class="psc"><div class="psc-lbl">${r.k}</div><div class="psc-val">${r.fmt(r.v||0)}</div><div class="psc-delta ${cls}">${txt}</div></div>`;
    }).join('');
  }

  function renderToggles(){
    const keys = ['lp_s1','lp_s2','lp_combined'];
    document.getElementById('prodToggles').innerHTML = keys.map(k=>{
      const a = state.enabled[k] ? ' active' : '';
      return `<button class="tgl${a}" data-key="${k}" type="button"><span class="tgl-dot" style="background:${COLORS[k]}"></span>${LABELS[k]}</button>`;
    }).join('');
    document.querySelectorAll('#prodToggles .tgl').forEach(btn=>{
      btn.onclick = () => {
        const k = btn.dataset.key;
        state.enabled[k] = !state.enabled[k];
        renderToggles();
        renderCharts();
      };
    });
  }

  function buildPath(values, xs, ys){
    const pts = values.map((v,i)=>`${xs(i)},${ys(v)}`);
    return 'M' + pts.join(' L');
  }

  function renderOneChart(card, cfg, labels, curSeries, prevSeries){
    const W = 400, H = 140, PL = 36, PR = 8, PT = 8, PB = 22;
    const n = labels.length;
    if(n === 0) return;
    const allVals = [].concat(...curSeries.map(s=>s.vals), ...(state.compare ? prevSeries.map(s=>s.vals) : []));
    const maxV = Math.max(1, ...allVals);
    const minV = 0;
    const xs = i => PL + (n<=1 ? 0 : (i*(W-PL-PR)/(n-1)));
    const ys = v => PT + (H-PT-PB) - ((v-minV)/(maxV-minV||1))*(H-PT-PB);

    const ticks = 4;
    const grid = Array.from({length:ticks+1},(_,i)=>{
      const v = minV + (maxV-minV)*i/ticks;
      const y = ys(v);
      return `<line class="grid" x1="${PL}" x2="${W-PR}" y1="${y}" y2="${y}"/><text class="axis-lbl" x="${PL-4}" y="${y+3}" text-anchor="end">${fmtNum(v)}</text>`;
    }).join('');

    const xTickIdx = [];
    const step = Math.max(1, Math.ceil(n/6));
    for(let i=0;i<n;i+=step) xTickIdx.push(i);
    if(xTickIdx[xTickIdx.length-1] !== n-1) xTickIdx.push(n-1);
    const xTicks = xTickIdx.map(i=>`<text class="axis-lbl" x="${xs(i)}" y="${H-6}" text-anchor="middle">${fmtDate(labels[i])}</text>`).join('');

    const prevPaths = state.compare ? prevSeries.map(s =>
      `<path class="line-prev" d="${buildPath(s.vals, xs, ys)}" stroke="${s.color}"/>`
    ).join('') : '';
    const curPaths = curSeries.map(s =>
      `<path class="line-cur line-enter" d="${buildPath(s.vals, xs, ys)}" stroke="${s.color}"/>`
    ).join('');

    const crossX = xs(0);
    card.querySelector('.chart-svg').innerHTML = `
      <line class="axis" x1="${PL}" x2="${W-PR}" y1="${H-PB}" y2="${H-PB}"/>
      <line class="axis" x1="${PL}" x2="${PL}" y1="${PT}" y2="${H-PB}"/>
      ${grid}${xTicks}${prevPaths}${curPaths}
      <line class="cross" x1="${crossX}" x2="${crossX}" y1="${PT}" y2="${H-PB}"/>
    `;
    card._meta = {xs, ys, labels, curSeries, prevSeries, PL, PR, W, PT, H, PB, n};
  }

  function renderCharts(){
    const cur = state.data.current.series;
    const prev = state.data.previous.series;
    const labels = cur.labels;
    const holder = document.getElementById('prodCharts');
    if(!holder.children.length){
      holder.innerHTML = CHARTS.map(c=>`
        <div class="chart-card" data-key="${c.key}">
          <div class="chart-title">${c.title}<small>(${c.unit})</small></div>
          <div class="chart-wrap"><svg class="chart-svg" viewBox="0 0 400 140" preserveAspectRatio="none"></svg></div>
        </div>`).join('');
      requestAnimationFrame(()=>holder.querySelectorAll('.chart-card').forEach((c,i)=>setTimeout(()=>c.classList.add('show'),i*80)));
      attachHover(holder);
    }
    CHARTS.forEach(cfg=>{
      const card = holder.querySelector(`.chart-card[data-key="${cfg.key}"]`);
      let curS, prevS;
      if(cfg.key === 'packs'){
        curS = [{vals:cur.packs, color:COLORS.packs, key:'packs'}];
        prevS = [{vals:prev.packs, color:COLORS.packs, key:'packs'}];
      } else {
        const k = cfg.key;
        if(!state.enabled[k]){
          curS = []; prevS = [];
        } else {
          curS = [{vals:cur[k], color:COLORS[k], key:k}];
          prevS = [{vals:prev[k], color:COLORS[k], key:k}];
        }
      }
      renderOneChart(card, cfg, labels, curS, prevS);
    });
  }

  function attachHover(holder){
    const onMove = e => {
      const card = e.currentTarget;
      const meta = card._meta; if(!meta) return;
      const rect = card.querySelector('.chart-svg').getBoundingClientRect();
      const px = e.clientX - rect.left;
      const vbX = px * 400 / rect.width;
      const plotW = meta.W - meta.PL - meta.PR;
      let idx = Math.round((vbX - meta.PL) / plotW * (meta.n-1));
      idx = Math.max(0, Math.min(meta.n-1, idx));
      syncHover(idx, e.clientX, e.clientY);
    };
    const onLeave = () => syncHover(-1);
    holder.querySelectorAll('.chart-card').forEach(card=>{
      card.addEventListener('mousemove', onMove);
      card.addEventListener('mouseleave', onLeave);
      card.addEventListener('touchmove', ev=>{const t=ev.touches[0];onMove({currentTarget:card,clientX:t.clientX,clientY:t.clientY});},{passive:true});
      card.addEventListener('touchend', onLeave);
    });
  }

  function syncHover(idx, cx, cy){
    const cards = document.querySelectorAll('#prodCharts .chart-card');
    const t = tip();
    if(idx < 0){
      cards.forEach(c=>c.querySelector('.chart-svg').classList.remove('hover'));
      t.classList.remove('show');
      return;
    }
    const cur = state.data.current.series, prev = state.data.previous.series;
    const dateLabel = cur.labels[idx];
    cards.forEach(c=>{
      const svg = c.querySelector('.chart-svg'); svg.classList.add('hover');
      const meta = c._meta; if(!meta) return;
      const cross = svg.querySelector('.cross');
      if(cross){const x = meta.xs(idx); cross.setAttribute('x1',x); cross.setAttribute('x2',x);}
    });
    const lines = [`<b>${dateLabel}</b>`];
    lines.push(`Packs: ${cur.packs[idx] ?? 0}`);
    ['lp_s1','lp_s2','lp_combined'].forEach(k=>{
      if(!state.enabled[k] && k!=='lp_combined') return;
      lines.push(`${LABELS[k]}: ${(cur[k][idx]||0).toFixed(2)} p/h${state.compare?` <span style="opacity:.6">(prev ${(prev[k][idx]||0).toFixed(2)})</span>`:''}`);
    });
    t.innerHTML = lines.join('<br>');
    t.classList.add('show');
    const tw = t.offsetWidth, th = t.offsetHeight;
    const x = Math.min(window.innerWidth - tw - 8, cx + 12);
    const y = Math.max(8, cy - th - 12);
    t.style.left = x + 'px';
    t.style.top = y + 'px';
  }

  async function load(){
    const r = await fetch(`api/productivity?range=${state.range}`);
    state.data = await r.json();
    renderSummary();
    renderToggles();
    document.getElementById('prodCharts').innerHTML = '';
    renderCharts();
  }

  function exportCsv(){
    if(!state.data) return;
    const cur = state.data.current.series, prev = state.data.previous.series;
    const rows = [['date','packs','hours_s1','hours_s2','hours_combined','lp_s1','lp_s2','lp_combined','prev_date','prev_packs','prev_lp_combined']];
    cur.labels.forEach((d,i)=>{
      rows.push([d, cur.packs[i], cur.hours_s1[i], cur.hours_s2[i], cur.hours_combined[i], cur.lp_s1[i], cur.lp_s2[i], cur.lp_combined[i], prev.labels[i]||'', prev.packs[i]||0, prev.lp_combined[i]||0]);
    });
    const csv = rows.map(r=>r.map(v=>{const s=String(v??'');return /[",\n]/.test(s)?`"${s.replace(/"/g,'""')}"`:s;}).join(',')).join('\n');
    const blob = new Blob([csv], {type:'text/csv'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `productivity_${state.range}_${state.data.current.series.labels.at(-1)||'data'}.csv`;
    document.body.appendChild(a); a.click(); a.remove();
  }

  function exportPdf(){
    document.body.classList.add('print-prod');
    setTimeout(()=>{window.print(); setTimeout(()=>document.body.classList.remove('print-prod'), 500);}, 50);
  }

  function bind(){
    document.querySelectorAll('#prodRange .prod-pill').forEach(b=>{
      b.addEventListener('click', ()=>{
        document.querySelectorAll('#prodRange .prod-pill').forEach(x=>x.classList.remove('active'));
        b.classList.add('active');
        state.range = b.dataset.range;
        document.getElementById('prodCharts').innerHTML = '';
        load();
      });
    });
    document.getElementById('prodCompare').addEventListener('change', e=>{state.compare=e.target.checked; renderCharts();});
    document.getElementById('prodCsvBtn').addEventListener('click', exportCsv);
    document.getElementById('prodPdfBtn').addEventListener('click', exportPdf);
  }

  return {
    ensureLoaded(){ if(!state.loaded){state.loaded=true; bind(); load();} },
  };
})();

async function init(){
  let date=params.get('date');
  if(!date){
    try{const r=await fetch('api/gantt/latest-date');const d=await r.json();date=d.date||new Date().toISOString().slice(0,10);}
    catch{date=new Date().toISOString().slice(0,10);}
  }
  $('dateInput').value=date;
  $('dateInput').addEventListener('change',e=>{
    const d=e.target.value;if(d){history.replaceState(null,'','?date='+d+(params.get('embed')?'&embed=1':''));load(d);}
  });
  $('refreshBtn').addEventListener('click',()=>load($('dateInput').value));
  $('printBtn').addEventListener('click',()=>window.print());
  load(date);
}
init();
</script>
