<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign in · 現場 FMS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg-1:#0b1226; --bg-2:#111c3a;
  --surface:#1a2440; --surface-2:#20304f;
  --line:#2a3a5c;
  --ink:#e8eef8; --muted:#8794ad;
  --brand:#5eead4; --brand-strong:#2dd4bf;
  --accent:#818cf8;
  --danger:#f87171; --danger-soft:rgba(248,113,113,.12);
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;background:var(--bg-1);color:var(--ink);font-family:"Inter","Segoe UI",sans-serif;}
body{
  min-height:100vh;display:grid;place-items:center;padding:1rem;
  background:
    radial-gradient(1200px 600px at 80% -10%, rgba(94,234,212,.10), transparent 60%),
    radial-gradient(900px 400px at 10% 110%, rgba(129,140,248,.12), transparent 60%),
    linear-gradient(180deg,var(--bg-1),var(--bg-2) 70%);
}
.card{
  width:min(420px,100%);background:var(--surface);border:1px solid var(--line);border-radius:18px;
  padding:2.2rem 1.8rem;box-shadow:0 1px 2px rgba(0,0,0,.3),0 24px 60px rgba(0,0,0,.4);
  position:relative;overflow:hidden;
}
.card::before{
  content:"";position:absolute;inset:0 0 auto 0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(94,234,212,.4),transparent);
}
.brand{display:flex;align-items:center;gap:.55rem;margin-bottom:.4rem;}
.brand .logo{
  width:34px;height:34px;border-radius:9px;display:grid;place-items:center;
  background:linear-gradient(135deg,var(--brand),var(--accent));color:#0b1226;
  font-weight:800;font-size:1rem;letter-spacing:-.02em;
}
.brand .name{
  font-weight:800;font-size:1.25rem;letter-spacing:-.01em;
  background:linear-gradient(120deg,var(--brand),var(--accent));
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
}
.tagline{color:var(--muted);font-size:.82rem;margin-bottom:1.6rem;}
.form{display:flex;flex-direction:column;gap:.85rem;}
.field label{display:block;font-size:.7rem;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.06em;margin-bottom:.3rem;}
.field input{
  width:100%;font:inherit;font-size:.95rem;padding:.65rem .85rem;
  background:var(--surface-2);border:1px solid var(--line);border-radius:9px;color:var(--ink);
  outline:none;transition:border-color .15s,box-shadow .15s;
}
.field input:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(94,234,212,.15);}
.btn{
  font:inherit;font-size:.95rem;font-weight:700;padding:.75rem 1rem;border:0;border-radius:10px;cursor:pointer;
  background:linear-gradient(135deg,var(--brand),var(--brand-strong));color:#0b1226;
  transition:transform .15s,box-shadow .15s;margin-top:.4rem;
}
.btn:hover{transform:translateY(-1px);box-shadow:0 8px 20px rgba(94,234,212,.25);}
.btn:active{transform:translateY(0);}
.btn:disabled{opacity:.6;cursor:wait;transform:none;}
.msg{margin-top:.9rem;padding:.65rem .85rem;border-radius:8px;font-size:.82rem;display:none;}
.msg.err{display:block;background:var(--danger-soft);color:var(--danger);border:1px solid rgba(248,113,113,.3);}
.foot{margin-top:1.4rem;padding-top:1rem;border-top:1px solid var(--line);font-size:.72rem;color:var(--muted);text-align:center;}
.foot code{font-family:"JetBrains Mono",monospace;color:var(--ink);background:var(--surface-2);padding:.1rem .4rem;border-radius:5px;}

/* ---- animated background ---- */
.bg{position:fixed;inset:0;overflow:hidden;z-index:0;pointer-events:none;}
.bg .orb{position:absolute;border-radius:50%;filter:blur(70px);opacity:.5;mix-blend-mode:screen;will-change:transform;}
.bg .o1{width:42vmax;height:42vmax;left:-12vmax;top:-14vmax;
  background:radial-gradient(circle at 30% 30%,rgba(94,234,212,.55),transparent 70%);
  animation:drift1 22s ease-in-out infinite;}
.bg .o2{width:38vmax;height:38vmax;right:-12vmax;bottom:-14vmax;
  background:radial-gradient(circle at 70% 70%,rgba(129,140,248,.55),transparent 70%);
  animation:drift2 26s ease-in-out infinite;}
.bg .o3{width:30vmax;height:30vmax;left:50%;top:55%;
  background:radial-gradient(circle at 50% 50%,rgba(45,212,191,.35),transparent 70%);
  animation:drift3 30s ease-in-out infinite;}
.bg .grid{position:absolute;inset:-2px;
  background-image:linear-gradient(rgba(94,234,212,.06) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(94,234,212,.06) 1px,transparent 1px);
  background-size:46px 46px;
  -webkit-mask-image:radial-gradient(ellipse 72% 60% at 50% 45%,#000 35%,transparent 78%);
  mask-image:radial-gradient(ellipse 72% 60% at 50% 45%,#000 35%,transparent 78%);
  animation:gridPan 28s linear infinite;}
@keyframes drift1{50%{transform:translate(8vmax,6vmax) scale(1.12);}}
@keyframes drift2{50%{transform:translate(-7vmax,-5vmax) scale(1.10);}}
@keyframes drift3{50%{transform:translate(-6vmax,4vmax) scale(1.15);}}
@keyframes gridPan{to{background-position:46px 46px;}}

/* ---- card entrance + accents ---- */
.card{position:relative;z-index:1;animation:cardIn .7s cubic-bezier(.22,1,.36,1) both;
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);}
@keyframes cardIn{from{opacity:0;transform:translateY(18px) scale(.985);}to{opacity:1;transform:none;}}
.card::before{background-size:200% 100%;animation:lineShimmer 3.6s ease-in-out infinite;}
@keyframes lineShimmer{0%,100%{background-position:0 0;}50%{background-position:100% 0;}}
.brand .logo{box-shadow:0 6px 16px rgba(94,234,212,.28);}
.btn{position:relative;overflow:hidden;}
.btn::after{content:"";position:absolute;inset:0;
  background:linear-gradient(120deg,transparent 35%,rgba(255,255,255,.35) 50%,transparent 65%);
  transform:translateX(-120%);transition:transform .6s ease;}
.btn:hover::after{transform:translateX(120%);}

/* aurora/entry motion reserved for the public home page only — keep this surface static */
.bg .orb,.bg .grid,.card,.card::before,.btn::after{animation:none!important;}
.card{opacity:1;transform:none;}
</style>
</head>
<body>
<div class="bg" aria-hidden="true">
  <span class="orb o1"></span>
  <span class="orb o2"></span>
  <span class="orb o3"></span>
  <div class="grid"></div>
</div>
<form class="card" id="loginForm" autocomplete="on">
  <div class="brand">
    <span class="logo">現</span>
    <span class="name">現場 FMS</span>
  </div>
  <div class="tagline">Manufacturing operations console — sign in to continue</div>

  <div class="form">
    <div class="field">
      <label for="u">Username</label>
      <input id="u" name="username" type="text" required autocomplete="username" autofocus />
    </div>
    <div class="field">
      <label for="p">Password</label>
      <input id="p" name="password" type="password" required autocomplete="current-password" />
    </div>
    <button class="btn" id="btn" type="submit">Sign in →</button>
  </div>
  <div class="msg" id="msg"></div>

  <div class="foot">First time? Use the seeded <code>admin</code> account, then create your own users in <b>⚙️ Setup → Users</b>.</div>
</form>

<script>
(() => {
  const form = document.getElementById("loginForm");
  const msg = document.getElementById("msg");
  const btn = document.getElementById("btn");
  const params = new URLSearchParams(location.search);
  const next = params.get("next") || "/dashboard";

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    msg.className = "msg"; msg.textContent = "";
    btn.disabled = true; btn.textContent = "Signing in…";
    try {
      const r = await fetch("/api/auth/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          username: document.getElementById("u").value.trim(),
          password: document.getElementById("p").value,
          next,
        }),
        credentials: "same-origin",
      });
      const j = await r.json().catch(() => ({}));
      if (!r.ok) {
        msg.className = "msg err";
        msg.textContent = j.detail || "Login failed.";
        btn.disabled = false; btn.textContent = "Sign in →";
        return;
      }
      location.href = j.redirect || next;
    } catch (err) {
      msg.className = "msg err";
      msg.textContent = "Network error: " + (err && err.message || err);
      btn.disabled = false; btn.textContent = "Sign in →";
    }
  });
})();
</script>
</body>
</html>
